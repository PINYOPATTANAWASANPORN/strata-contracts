name: CI

# Build, test, clippy and fmt on every push and pull request. Nothing is
# allowed to merge without all four.

on:
  push:
    branches: [main]
  pull_request:
  # Also run on the initial push to an empty repo.
  workflow_dispatch:

# A new push to a PR supersedes the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run the test suite
        run: cargo test --all --locked

      # The same tests with a much larger generated-input budget. Cheap in
      # release, and it is where a settlement bug would actually surface.
      - name: Property tests at scale
        run: cargo test --release --locked
        env:
          PROPTEST_CASES: 20000

  build-wasm:
    name: build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # `cargo build` does NOT produce a deployable contract. The Soroban
      # runtime only accepts wasm32v1-none built by `stellar contract build`,
      # which applies the required build settings. This job exists to prove
      # that still works for every contract in the workspace.
      # `stellar-cli` is not a pure-Rust binary: parts of it need system
      # libraries at build time, and each missing one surfaces as a confusing
      # panic from some dependency's build script rather than as a clear "package
      # not found". Checked against stellar-cli's own Cargo.lock for the pinned
      # version, which is the honest way to answer this:
      #
      #   libdbus-1-dev  libdbus-sys, reached through keyring
      #   libudev-dev    hidapi, which backs hardware-wallet support
      #   pkg-config     the pkg-config build script all of the above use
      #
      # No openssl package is needed: reqwest is built with `rustls-tls`, so
      # openssl-sys is absent from the lockfile.
      #
      # This step was failing on main for this reason, one missing package at a
      # time. `cargo install` is kept rather than downloading a prebuilt binary
      # because crates.io verifies every crate's checksum, whereas a release
      # asset on GitHub ships no published checksum to check against.
      - name: Install the Stellar CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libudev-dev \
            pkg-config
          cargo install stellar-cli --locked

      - name: Build the contracts
        run: stellar contract build

      # Counting wasm files is not enough: it passes if the SDK renames a
      # contract and only one of them builds. Every deployable contract is
      # named explicitly, because a silently missing artefact here only shows
      # up much later as a failed deployment.
      - name: Check the artefacts
        run: |
          set -euo pipefail
          for wasm in target/wasm32v1-none/release/*.wasm; do
            echo "built: $wasm ($(stat -c%s "$wasm") bytes)"
          done
          for name in strata_epoch_manager strata_mock_vault strata_blend_adapter; do
            wasm="target/wasm32v1-none/release/${name}.wasm"
            if [ ! -f "$wasm" ]; then
              echo "missing $wasm - did 'stellar contract build' succeed?"
              exit 1
            fi
            if [ ! -s "$wasm" ]; then
              echo "$wasm is empty"
              exit 1
            fi
          done
          echo "both deployable contracts present"

  docs:
    name: docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # Every invariant named in the spec must have a property test, and the
      # spec's own file paths must resolve. Cheap, and it stops the spec and
      # the tests drifting apart without anyone noticing.
      - name: Check the spec against the test suite
        run: |
          set -euo pipefail
          missing=0
          for n in 1 2 3 4 5; do
            if ! grep -q "invariant_${n}_" tests/src/waterfall_props.rs; then
              echo "waterfall-spec.md claims invariant $n but no test matches invariant_${n}_"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          for f in $(grep -oE '\((docs/[a-z-]+\.md|[a-z-]+\.md)\)' docs/waterfall-spec.md | tr -d '()' | sort -u); do
            if [ ! -f "$f" ] && [ ! -f "docs/$f" ]; then
              echo "waterfall-spec.md links to $f, which does not exist"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "spec invariants and links check out"

      # The "testnet only" rule is a control, not a promise, so the part of it
      # that can run without credentials is actually run.
      - name: The deploy script refuses non-testnets
        run: ./scripts/deploy-testnet.sh --self-test

      # Branch protection is set by a maintainer from a script, not by this
      # repository, so the one thing CI can usefully do is prove the script still
      # refuses the wrong repository and still names every job in this file.
      # That last part is the valuable one: rename a job here and forget to
      # re-apply protection, and the required check silently stops existing.
      - name: The branch protection script is sound
        run: ./scripts/set-branch-protection.sh --self-test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # `continue-on-error` keeps the workflow run green, but it does not make the
    # check green: a failing job still reports a failed check run, and the
    # `protect-main` ruleset requires this check by name (`dependency audit`) on
    # every pull request. So in practice a failing audit **does** block a merge,
    # and this job has to genuinely pass.
    #
    # One advisory is ignored, deliberately and by ID, in `.cargo/audit.toml`,
    # with the reasoning and the removal condition recorded there. A new
    # advisory is not ignored and will fail this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
