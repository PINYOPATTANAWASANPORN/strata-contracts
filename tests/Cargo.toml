[package]
name = "strata-tests"
description = "Cross-contract integration tests and property tests for Strata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]

[dev-dependencies]
strata-waterfall = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
strata-epoch-manager = { workspace = true, features = ["testutils"] }
strata-mock-vault = { workspace = true, features = ["testutils"] }
strata-vault-interface = { workspace = true }
strata-blend-adapter = { workspace = true, features = ["testutils"] }
strata-blend-pool-mock = { workspace = true, features = ["testutils"] }
